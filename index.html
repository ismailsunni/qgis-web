<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuarkGIS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23589632'/><path d='M10 16a6 6 0 1 1 9 5.2l3 3' stroke='white' stroke-width='3' fill='none'/></svg>" />
    <!-- The engine needs a secure context (SharedArrayBuffer, service worker). -->
    <script>
      if (location.protocol === "http:" && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) location.protocol = "https:";
    </script>
    <!-- Service worker: cross-origin isolation on static hosts and an engine cache (public/sw.js). -->
    <script>
      if ("serviceWorker" in navigator && isSecureContext && "%PROD%" === "true") {
        navigator.serviceWorker.register("./sw.js?v=%VITE_QGIS_JS_VERSION%").then((reg) => {
          if (crossOriginIsolated || navigator.serviceWorker.controller) return;
          // First visit: reload once the worker controls the page, so its headers apply.
          const reload = () => !sessionStorage.quarkgisSw && ((sessionStorage.quarkgisSw = "1"), location.reload());
          if (reg.active) reload();
          else navigator.serviceWorker.addEventListener("controllerchange", reload);
        });
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
